<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Wallander Group</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        font-family: 'Lora', Georgia, serif;
        background-color: #fafafa;
        color: #171717;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      .container {
        max-width: 32rem;
        text-align: center;
      }
      .logo-mark {
        width: 2.5rem;
        height: 2.5rem;
        background-color: #000;
        color: #fff;
        font-family: 'Playfair Display', serif;
        font-size: 1.5rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 2rem;
      }
      h1 {
        font-family: 'Playfair Display', serif;
        font-size: 2.5rem;
        margin: 0 0 1rem;
        font-weight: 400;
      }
      p {
        color: #525252;
        font-size: 1.125rem;
        line-height: 1.6;
        margin: 0 0 2rem;
      }
      a.btn {
        display: inline-block;
        background-color: #000;
        color: #fff;
        padding: 0.875rem 2rem;
        text-decoration: none;
        font-family: 'Playfair Display', serif;
        font-size: 0.95rem;
        letter-spacing: 0.05em;
        transition: background-color 0.2s ease;
      }
      a.btn:hover {
        background-color: #333;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo-mark">W</div>
      <h1>Page Not Found</h1>
      <p>The page you are looking for does not exist or has been moved.</p>
      <a href="/" class="btn">Return to Homepage</a>
    </div>
  </body>
</html>
